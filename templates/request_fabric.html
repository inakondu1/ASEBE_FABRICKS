<!DOCTYPE html>
<html>
<head>
    <title>Request Fabric</title>
</head>

<body>

<h1>Request A Fabric</h1>

<p>
Can't find the fabric you want?
Send us a picture and details.
</p>

<form action="/fabric-request" method="POST" enctype="multipart/form-data">

    <label>Fabric Image:</label><br>
    <input type="file" name="image" accept="image/*"><br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="5" cols="40"
        placeholder="Describe the fabric you want"></textarea><br><br>

    <label>Quantity:</label><br>
    <input type="text" name="quantity"
        placeholder="Example: 6 yards"><br><br>

    <button type="submit">
        Submit Request
    </button>

</form>

<br>

<a href="/customer">
    Back to Dashboard
</a>

</body>
</html>
