<!DOCTYPE html>
<html>
<head>
    <title>My Fabric Requests</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header>
    <a href="/">HOME</a>
    <a href="/shop">SHOP</a>
    <a href="/customer">MY ACCOUNT</a>
</header>


<section class="shop-header">

    <p>ASEBE FABRICS</p>

    <h1>🧵 MY FABRIC REQUESTS</h1>

</section>


<section style="max-width:1000px; margin:40px auto; padding:20px;">


{{range .}}

<div class="product-card">

    <div class="product-info">

        <h2>Fabric Request #{{.ID}}</h2>

        <p>
            <strong>Description:</strong>
            {{.Description}}
        </p>


        <p>
            <strong>Quantity:</strong>
            {{.Quantity}}
        </p>


        <p>
            <strong>Status:</strong>
            {{.Status}}
        </p>


        <p>
            <strong>Date:</strong>
            {{.CreatedAt}}
        </p>


        {{if .Image}}

        <img 
        src="{{.Image}}" 
        style="max-width:300px;">

        {{end}}


    </div>

</div>


{{else}}

<p>
You have not made any fabric requests yet.
</p>

{{end}}


</section>


</body>
</html>
