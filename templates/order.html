<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASEBE FABRICS | Order</title>

    <link rel="stylesheet"
          href="/static/css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>ASEBE</span> FABRICS
    </div>

    <nav>
        
    <a href="/">HOME</a>
    <a href="/shop">SHOP</a>
    <a href="/cart">CART 🛒</a>
    <a href="/order">ORDER</a>
    
    <a href="/payment">PAYMENT</a>
</nav>

</header>


<section class="shop-header">

    <p>ASEBE FABRICS</p>

    <h1>PLACE YOUR ORDER</h1>

    <span>
        Complete your information below.
    </span>

</section>


<section class="add-fabric-page">

    <div class="add-fabric-card">

        <div class="form-heading">

            <h1>Customer Information</h1>

            <p>
                Please provide your details so we can process your order.
            </p>

        </div>


        <form
            class="fabric-form"
            method="POST"
            action="/order">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="08012345678"
                    required>

            </div>


            <div class="form-group">

                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your delivery address"
                    required></textarea>

            </div>


            <div class="form-group">

                <label for="note">
                    Additional Note
                </label>

                <textarea
                    id="note"
                    name="note"
                    placeholder="Any additional information about your order"></textarea>

            </div>


            <div class="form-actions">

                <a
                    href="/cart"
                    class="cancel-button">

                    BACK TO CART

                </a>


                <button
                    type="submit"
                    class="save-button">

                    CONTINUE ORDER

                </button>

            </div>

        </form>

    </div>

</section>


<footer>

    <div class="footer-logo">
        ASEBE <span>FABRICS</span>
    </div>

    <p>
        Quality Fabrics • Beautiful Designs • Great Prices
    </p>

</footer>


</body>

</html>
