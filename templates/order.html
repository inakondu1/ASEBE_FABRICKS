<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASEBE FABRICS | Place Order</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>ASEBE</span> FABRICS
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
    </nav>

</header>


<section class="order-page">

    <div class="order-container">

        <div class="order-heading">

            <p>ASEBE FABRICS</p>

            <h1>PLACE YOUR ORDER</h1>

            <span>
                Fill in your details and we'll receive
                your order directly on WhatsApp.
            </span>

        </div>


        <form
            action="/order"
            method="POST"
            class="order-form">


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required>


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                name="phone"
                placeholder="08012345678"
                required>


            <label>
                Select Fabric
            </label>

            <select name="fabric" required>

                <option value="">
                    -- Select a fabric --
                </option>

                <option value="Royal Ankara">
                    Royal Ankara - ₦25,000
                </option>

                <option value="Luxury Lace">
                    Luxury Lace - ₦35,000
                </option>

                <option value="Classic Senator">
                    Classic Senator - ₦30,000
                </option>

                <option value="Premium Silk">
                    Premium Silk - ₦40,000
                </option>

            </select>


            <label>
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                min="1"
                value="1"
                required>


            <label>
                Delivery Address
            </label>

            <textarea
                name="address"
                rows="5"
                placeholder="Enter your delivery address"
                required></textarea>


            <button
                type="submit"
                class="submit-order">

                CONTINUE TO WHATSAPP

            </button>

        </form>

    </div>

</section>


<footer>

    <div class="footer-logo">
        ASEBE <span>FABRICS</span>
    </div>

    <p>
        Quality Fabrics • Beautiful Designs • Great Prices
    </p>

</footer>

</body>

</html>
