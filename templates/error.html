<!DOCTYPE html>
<html>
<head>
    <title>{{.Title}} - ASEBE FABRICS</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<section style="
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5efe6;
">

<div style="
    background:white;
    padding:40px;
    border-radius:15px;
    width:420px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
">

    <h1 style="
        color:#3b2418;
        margin-bottom:20px;
    ">
        ASEBE FABRICS
    </h1>


    <h2 style="
        color:#b30000;
        margin-bottom:15px;
    ">
        {{.Title}}
    </h2>


    <p style="
        color:#555;
        font-size:18px;
        margin-bottom:30px;
    ">
        {{.Message}}
    </p>


    <a href="/register" style="
        background:#3b2418;
        color:white;
        padding:12px 25px;
        border-radius:8px;
        text-decoration:none;
        font-weight:bold;
    ">
        GO BACK
    </a>

</div>

</section>

</body>
</html>
