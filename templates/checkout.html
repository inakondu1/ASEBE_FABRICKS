<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASEBE FABRICS | Checkout</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>ASEBE</span> FABRICS
    </div>

    <nav>

        <a href="/">HOME</a>
        <a href="/shop">SHOP</a>
        <a href="/cart">CART 🛒</a>
        <a href="/payment">PAYMENT</a>

    </nav>

</header>


<section class="shop-header">

    <p>ASEBE FABRICS</p>

    <h1>CHECKOUT</h1>

    <span>
        Complete your order.
    </span>

</section>


<section style="max-width:600px; margin:40px auto; padding:20px;">

    <form id="checkout-form">

        <label>
            Full Name
        </label>

        <input
            type="text"
            id="customer-name"
            placeholder="Enter your full name"
            required
            style="width:100%; padding:14px; margin:10px 0 20px;"
        >


        <label>
            Phone Number
        </label>

        <input
            type="tel"
            id="customer-phone"
            placeholder="08012345678"
            required
            style="width:100%; padding:14px; margin:10px 0 20px;"
        >


        <label>
            Delivery Address
        </label>

        <textarea
            id="customer-address"
            placeholder="Enter your delivery address"
            required
            style="width:100%; padding:14px; margin:10px 0 20px; min-height:120px;"
        ></textarea>


        <div id="order-summary"
             style="margin:25px 0;">
        </div>


        <button
            type="submit"
            class="order-button"
            style="width:100%;">

            ORDER VIA WHATSAPP 📱

        </button>

    </form>

</section>


<footer>

    <div class="footer-logo">
        ASEBE <span>FABRICS</span>
    </div>

    <p>
        Quality Fabrics • Beautiful Designs • Great Prices
    </p>

</footer>


<script>

const form =
    document.getElementById("checkout-form");

const summary =
    document.getElementById("order-summary");


let cart =
    JSON.parse(
        localStorage.getItem("asebeCart")
    ) || [];


if (cart.length === 0) {

    summary.innerHTML = `

        <div class="empty-shop">

            <h2>Your cart is empty.</h2>

            <a href="/shop"
               class="order-button"
               style="text-decoration:none; display:inline-block;">

                GO TO SHOP

            </a>

        </div>

    `;

    form.style.display = "none";

} else {

    let total = 0;

    let html = "<h2>Order Summary</h2>";


    cart.forEach(function(item) {

        const itemTotal =
            item.price * item.quantity;

        total += itemTotal;


        html += `

            <p>
                <strong>${item.name}</strong>
                × ${item.quantity}
                — ₦${itemTotal.toLocaleString()}
            </p>

        `;

    });


    html += `

        <hr>

        <h2>
            Total: ₦${total.toLocaleString()}
        </h2>

    `;


    summary.innerHTML = html;
}


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        if (cart.length === 0) {

            alert("Your cart is empty.");

            return;
        }


        const name =
            document.getElementById(
                "customer-name"
            ).value.trim();


        const phone =
            document.getElementById(
                "customer-phone"
            ).value.trim();


        const address =
            document.getElementById(
                "customer-address"
            ).value.trim();


        let message =
            "🛍️ *NEW ASEBE FABRICS ORDER*%0A%0A";


        message +=
            "*Customer:* " +
            encodeURIComponent(name) +
            "%0A";


        message +=
            "*Phone:* " +
            encodeURIComponent(phone) +
            "%0A";


        message +=
            "*Address:* " +
            encodeURIComponent(address) +
            "%0A%0A";


        message +=
            "*ORDER DETAILS*%0A";


        let total = 0;


        cart.forEach(function(item) {

            const itemTotal =
                item.price * item.quantity;

            total += itemTotal;


            message +=
                encodeURIComponent(
                    item.name
                ) +
                " × " +
                item.quantity +
                " — ₦" +
                itemTotal.toLocaleString() +
                "%0A";

        });


        message +=
            "%0A*TOTAL: ₦" +
            total.toLocaleString() +
            "*";


        /*
           REPLACE THIS NUMBER WITH
           ASEBE FABRICS' WHATSAPP NUMBER.

           Nigerian format:
           2348012345678

           Do NOT include +
           Do NOT include spaces.
        */

        const whatsappNumber =
            "2348012345678";


        const whatsappURL =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            message;


        window.open(
            whatsappURL,
            "_blank"
        );

    }
);

</script>

</body>

</html>
EOF
