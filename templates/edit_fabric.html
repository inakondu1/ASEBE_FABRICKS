<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ASEBE FABRICS | Edit Fabric</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>ASEBE</span> FABRICS
    </div>

    <nav>

        <a href="/">HOME</a>
        <a href="/shop">SHOP</a>
        <a href="/admin">ADMIN</a>

    </nav>

</header>


<section class="shop-header">

    <p>ASEBE FABRICS</p>

    <h1>EDIT FABRIC</h1>

    <span>
        Update your fabric information.
    </span>

</section>


<section style="max-width:600px; margin:40px auto; padding:20px;">

    <form
        method="POST"
        action="/admin/edit-fabric"
        enctype="multipart/form-data"
        class="product-card">

        <div class="product-info">

            <input
                type="hidden"
                name="id"
                value="{{.ID}}">


            <label>
                Fabric Name
            </label>

            <input
                type="text"
                name="name"
                value="{{.Name}}"
                required>


            <label>
                Description
            </label>

            <textarea
                name="description"
                rows="5"
                required>{{.Description}}</textarea>


            <label>
                Price (₦)
            </label>

            <input
                type="number"
                name="price"
                value="{{.Price}}"
                min="0"
                required>


            <label>
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                value="{{.Quantity}}"
                min="0"
                required>


            <label>
                New Image
            </label>

            <input
                type="file"
                name="image"
                accept="image/*">


            {{if .Image}}

                <p>Current Image:</p>

                <img
                    src="{{.Image}}"
                    alt="{{.Name}}"
                    style="max-width:250px;">

            {{end}}


            <br><br>


            <button
                type="submit"
                class="order-button">

                SAVE CHANGES

            </button>


            <a
                href="/admin"
                class="order-button"
                style="text-decoration:none;
                       display:inline-block;">

                CANCEL

            </a>

        </div>

    </form>

</section>


<footer>

    <div class="footer-logo">
        ASEBE <span>FABRICS</span>
    </div>

    <p>
        Quality Fabrics • Beautiful Designs • Great Prices
    </p>

</footer>

</body>

</html>
